<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover, theme-color=#0b0f17">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>📺 IPTV Player Pro — m3u / m3u8 + EPG</title>
    <style>
        :root {
            --bg-primary: #0b0f17;
            --bg-secondary: #111827;
            --bg-tertiary: #1a202c;
            --accent: #2dd4bf;
            --accent-hover: #14b8a6;
            --text-primary: #f1f5f9;
            --text-secondary: #d1d5db;
            --text-muted: #9ca3af;
            --border: #374151;
            --danger: #ef4444;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
        }

        body {
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem;
            -webkit-tap-highlight-color: transparent;
            -webkit-user-select: none;
            user-select: none;
        }

        .player-app {
            width: 100%;
            max-width: 1000px;
            background: var(--bg-secondary);
            border-radius: 2rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.8);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            border: 1px solid var(--border);
            height: auto;
            max-height: 95vh;
        }

        /* Хедер с табами */
        .header-tabs {
            display: flex;
            background: var(--bg-tertiary);
            border-bottom: 1px solid var(--border);
            overflow-x: auto;
            -webkit-overflow-scrolling: touch;
        }

        .tab-btn {
            flex: 1;
            min-width: 80px;
            padding: 0.9rem 1rem;
            background: transparent;
            border: none;
            color: var(--text-muted);
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: 0.2s;
            border-bottom: 2px solid transparent;
            white-space: nowrap;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.4rem;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            background: rgba(45, 212, 191, 0.05);
        }

        .tab-btn:hover {
            color: var(--text-primary);
        }

        .tab-content {
            display: none;
            flex-direction: column;
            flex: 1;
            overflow: hidden;
        }

        .tab-content.active {
            display: flex;
        }

        /* Видео контейнер */
        .video-container {
            background: #000;
            position: relative;
            width: 100%;
            aspect-ratio: 16 / 9;
            max-height: 50vh;
            display: flex;
            align-items: center;
            justify-content: center;
            border-bottom: 2px solid var(--accent);
            flex-shrink: 0;
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: black;
            outline: none;
        }

        .pause-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0,0,0,0.8);
            background: rgba(0,0,0,0.1);
        }

        .pause-overlay.visible {
            opacity: 1;
        }

        .no-stream {
            color: var(--text-muted);
            font-size: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            text-align: center;
            padding: 1rem;
        }

        .no-stream span {
            font-size: 2rem;
            opacity: 0.7;
        }

        /* Контрол панель */
        .controls-panel {
            padding: 1rem;
            background: var(--bg-secondary);
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            overflow-y: auto;
            flex: 1;
            -webkit-overflow-scrolling: touch;
        }

        .url-input-group {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: 2.5rem;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: 0.2s;
        }

        .url-input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.2);
        }

        .url-input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.7rem 1rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            min-width: 0;
        }

        .url-input-group input::placeholder {
            color: var(--text-muted);
        }

        .search-input-group {
            display: flex;
            background: var(--bg-tertiary);
            border-radius: 2.5rem;
            overflow: hidden;
            border: 1px solid var(--border);
            transition: 0.2s;
            margin-bottom: 0.5rem;
        }

        .search-input-group:focus-within {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(45, 212, 191, 0.2);
        }

        .search-input-group input {
            flex: 1;
            background: transparent;
            border: none;
            padding: 0.7rem 1rem;
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            min-width: 0;
        }

        .search-input-group input::placeholder {
            color: var(--text-muted);
        }

        .btn {
            background: var(--accent-hover);
            color: #0b0f17;
            font-weight: 600;
            border: none;
            padding: 0.7rem 1.2rem;
            border-radius: 2.5rem;
            cursor: pointer;
            font-size: 0.85rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            transition: 0.2s;
            white-space: nowrap;
            border: 1px solid var(--accent);
            justify-content: center;
        }

        .btn:active {
            transform: scale(0.96);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .btn-outline:hover {
            background: var(--bg-tertiary);
        }

        .btn-small {
            padding: 0.5rem 0.9rem;
            font-size: 0.8rem;
        }

        .btn-danger {
            background: transparent;
            border: 1px solid var(--danger);
            color: var(--danger);
        }

        .btn-pause {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.7);
            border: 1px solid rgba(255,255,255,0.3);
            color: white;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            transition: 0.2s;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .btn-pause:hover {
            background: rgba(0,0,0,0.9);
            border-color: white;
        }

        .file-input-label {
            cursor: pointer;
            background: var(--bg-tertiary);
            padding: 0.7rem 1rem;
            border-radius: 2.5rem;
            display: flex;
            align-items: center;
            gap: 0.3rem;
            color: var(--text-secondary);
            font-weight: 500;
            transition: 0.2s;
            border: 1px solid var(--border);
            white-space: nowrap;
            justify-content: center;
        }

        input[type="file"] {
            display: none;
        }

        .action-row {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .action-row > * {
            flex: 1;
            min-width: 100px;
        }

        /* Список каналов */
        .channel-list {
            background: var(--bg-tertiary);
            border-radius: 1rem;
            overflow-y: auto;
            border: 1px solid var(--border);
            max-height: 300px;
            -webkit-overflow-scrolling: touch;
            flex: 1;
        }

        .channel-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.7rem 0.8rem;
            border-radius: 0.7rem;
            margin: 0.2rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: background 0.15s;
            font-size: 0.85rem;
            gap: 0.5rem;
            border-left: 3px solid transparent;
        }

        .channel-item:active {
            background: #253349;
        }

        .channel-item.active {
            background: #0f766e;
            color: white;
            font-weight: 600;
            border-left: 4px solid var(--accent);
        }

        .channel-name {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            overflow: hidden;
            flex: 1;
            min-width: 0;
        }

        .channel-name span:last-child {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .epg-info {
            font-size: 0.7rem;
            color: var(--accent);
            margin-left: auto;
            margin-right: 0.5rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .channel-actions {
            display: flex;
            gap: 0.3rem;
        }

        .icon-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: var(--text-muted);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.9rem;
            transition: 0.2s;
        }

        .icon-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            color: white;
        }

        /* Сохраненные плейлисты */
        .saved-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.8rem;
            background: var(--bg-tertiary);
            border-radius: 0.8rem;
            margin-bottom: 0.5rem;
            border: 1px solid var(--border);
            gap: 0.5rem;
        }

        .saved-info {
            flex: 1;
            overflow: hidden;
        }

        .saved-name {
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .saved-url {
            font-size: 0.75rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .saved-meta {
            font-size: 0.7rem;
            color: var(--text-muted);
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.75rem;
            padding: 0.3rem 0;
            flex-shrink: 0;
        }

        .empty-state {
            text-align: center;
            padding: 2rem 1rem;
            color: var(--text-muted);
        }

        /* Индикатор загрузки */
        .loading-spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Адаптивность */
        @media (max-width: 768px) {
            .player-app {
                border-radius: 1.2rem;
                max-height: 100vh;
                height: 100vh;
                margin: 0;
            }

            body {
                padding: 0;
            }

            .video-container {
                aspect-ratio: 16 / 9;
                max-height: 35vh;
            }

            .controls-panel {
                padding: 0.8rem;
                gap: 0.6rem;
            }

            .channel-list {
                max-height: 200px;
            }

            .btn {
                padding: 0.6rem 1rem;
                font-size: 0.8rem;
            }

            .tab-btn {
                padding: 0.7rem 0.8rem;
                font-size: 0.75rem;
            }

            .epg-info {
                max-width: 100px;
                font-size: 0.65rem;
            }
        }

        @media (max-width: 480px) {
            .action-row {
                flex-direction: column;
            }

            .video-container {
                max-height: 30vh;
            }

            .channel-list {
                max-height: 180px;
            }

            .saved-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .saved-item .btn {
                align-self: stretch;
                text-align: center;
            }
        }

        /* Скроллбар */
        ::-webkit-scrollbar {
            width: 4px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="player-app">
    <!-- Видео плеер -->
    <div class="video-container" id="videoContainer">
        <video id="videoPlayer" controls playsinline crossorigin="anonymous" webkit-playsinline>
            Ваш браузер не поддерживает видео.
        </video>
        <button class="btn-pause" id="pauseBtn" title="Пауза/Воспроизведение">⏯️</button>
        <div class="pause-overlay" id="pauseOverlay">⏸️</div>
        <div id="noStreamPlaceholder" class="no-stream">
            <span>📡</span>
            <p>Загрузите плейлист или поток</p>
        </div>
    </div>

    <!-- Табы -->
    <div class="header-tabs">
        <button class="tab-btn active" data-tab="playlist">📋 Плейлист</button>
        <button class="tab-btn" data-tab="saved">💾 Сохранённые</button>
        <button class="tab-btn" data-tab="direct">🔗 Прямой URL</button>
        <button class="tab-btn" data-tab="epg">📅 EPG</button>
    </div>

    <!-- Контент табов -->
    <div class="tab-content active" id="tab-playlist">
        <div class="controls-panel">
            <div class="search-input-group">
                <input type="text" id="searchInput" placeholder="🔍 Поиск каналов..." autocomplete="off">
                <button class="btn btn-small btn-outline" id="clearSearchBtn" style="border-radius: 2.5rem;">✕</button>
            </div>
            <div class="action-row">
                <div class="url-input-group" style="flex:2;">
                    <input type="text" id="m3uUrlInput" placeholder="Ссылка на m3u плейлист..." autocomplete="off">
                </div>
            </div>
            <div class="action-row">
                <label for="m3uFileInput" class="file-input-label">
                    📂 Выбрать файл .m3u
                </label>
                <input type="file" id="m3uFileInput" accept=".m3u,.m3u8,.txt">
                <button class="btn btn-outline" id="savePlaylistBtn">💾 Сохранить</button>
            </div>
            <div class="channel-list" id="channelListContainer">
                <div class="empty-state">Список каналов пуст</div>
            </div>
            <div class="status-bar">
                <span id="statusText">⚪ Ожидание</span>
                <span id="channelCount">0 каналов</span>
            </div>
        </div>
    </div>

    <div class="tab-content" id="tab-saved">
        <div class="controls-panel">
            <div style="display: flex; gap: 0.5rem; margin-bottom: 0.5rem;">
                <button class="btn btn-outline" id="exportAllBtn" style="flex:1;">📤 Экспорт</button>
                <button class="btn btn-danger" id="clearAllBtn" style="flex:1;">🗑️ Очистить всё</button>
            </div>
            <div id="savedListContainer" style="overflow-y: auto; flex: 1;">
                <div class="empty-state">Нет сохранённых элементов</div>
            </div>
        </div>
    </div>

    <div class="tab-content" id="tab-direct">
        <div class="controls-panel">
            <div class="url-input-group">
                <input type="text" id="directUrlInput" placeholder="Вставьте прямую ссылку на поток (m3u8, mp4 и др.)" autocomplete="off">
            </div>
            <div class="action-row">
                <button class="btn" id="playDirectBtn">▶️ Воспроизвести</button>
                <button class="btn btn-outline" id="saveDirectBtn">💾 Сохранить поток</button>
            </div>
            <div style="color: var(--text-muted); font-size: 0.8rem; padding: 0.5rem;">
                💡 Поддерживаются HLS (.m3u8), DASH, MP4 и другие форматы
            </div>
        </div>
    </div>

    <div class="tab-content" id="tab-epg">
        <div class="controls-panel">
            <div class="url-input-group">
                <input type="text" id="epgUrlInput" placeholder="Ссылка на EPG (XMLTV) или вставьте данные..." autocomplete="off">
            </div>
            <div class="action-row">
                <button class="btn" id="loadEpgBtn">📥 Загрузить EPG</button>
                <label for="epgFileInput" class="file-input-label">
                    📂 Файл EPG
                </label>
                <input type="file" id="epgFileInput" accept=".xml,.xmltv,.gz">
            </div>
            <div style="color: var(--text-muted); font-size: 0.8rem; padding: 0.5rem;">
                💡 EPG автоматически сопоставляется с каналами по названию
            </div>
            <div id="epgStatus" style="color: var(--text-muted); font-size: 0.8rem;"></div>
        </div>
    </div>
</div>

<script>
    (function() {
        // ---------- DOM элементы ----------
        const video = document.getElementById('videoPlayer');
        const videoContainer = document.getElementById('videoContainer');
        const noStreamDiv = document.getElementById('noStreamPlaceholder');
        const pauseBtn = document.getElementById('pauseBtn');
        const pauseOverlay = document.getElementById('pauseOverlay');
        const m3uUrlInput = document.getElementById('m3uUrlInput');
        const m3uFileInput = document.getElementById('m3uFileInput');
        const savePlaylistBtn = document.getElementById('savePlaylistBtn');
        const playDirectBtn = document.getElementById('playDirectBtn');
        const saveDirectBtn = document.getElementById('saveDirectBtn');
        const directUrlInput = document.getElementById('directUrlInput');
        const searchInput = document.getElementById('searchInput');
        const clearSearchBtn = document.getElementById('clearSearchBtn');
        const channelListContainer = document.getElementById('channelListContainer');
        const savedListContainer = document.getElementById('savedListContainer');
        const statusText = document.getElementById('statusText');
        const channelCountSpan = document.getElementById('channelCount');
        const exportAllBtn = document.getElementById('exportAllBtn');
        const clearAllBtn = document.getElementById('clearAllBtn');
        const epgUrlInput = document.getElementById('epgUrlInput');
        const loadEpgBtn = document.getElementById('loadEpgBtn');
        const epgFileInput = document.getElementById('epgFileInput');
        const epgStatus = document.getElementById('epgStatus');
        const tabButtons = document.querySelectorAll('.tab-btn');
        const tabContents = document.querySelectorAll('.tab-content');

        // ---------- Состояние ----------
        let channels = [];
        let activeChannelIndex = -1;
        let currentPlaylistSource = '';
        let epgData = {};
        let currentSearchQuery = '';

        // ---------- Локальное хранилище ----------
        const STORAGE_KEY = 'iptv_player_saved_items';
        const EPG_STORAGE_KEY = 'iptv_player_epg_data';

        function getSavedItems() {
            try {
                const data = localStorage.getItem(STORAGE_KEY);
                return data ? JSON.parse(data) : [];
            } catch (e) {
                return [];
            }
        }

        function saveItems(items) {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(items));
            } catch (e) {
                setStatus('❌ Ошибка сохранения: хранилище переполнено', true);
            }
        }

        function saveEpgToStorage(data) {
            try {
                localStorage.setItem(EPG_STORAGE_KEY, JSON.stringify(data));
            } catch (e) {
                console.warn('EPG storage full, saving trimmed version');
                const trimmed = {};
                for (const [ch, programs] of Object.entries(data)) {
                    trimmed[ch] = programs.slice(0, 5);
                }
                localStorage.setItem(EPG_STORAGE_KEY, JSON.stringify(trimmed));
            }
        }

        function loadEpgFromStorage() {
            try {
                const data = localStorage.getItem(EPG_STORAGE_KEY);
                return data ? JSON.parse(data) : {};
            } catch (e) {
                return {};
            }
        }

        function addSavedItem(item) {
            const items = getSavedItems();
            const exists = items.find(i => i.url === item.url);
            if (exists) {
                setStatus('⚠️ Элемент с таким URL уже сохранён', true);
                return false;
            }
            item.id = Date.now().toString();
            item.date = new Date().toLocaleString();
            items.push(item);
            saveItems(items);
            renderSavedItems();
            setStatus('✅ Сохранено!');
            return true;
        }

        function removeSavedItem(id) {
            let items = getSavedItems();
            items = items.filter(i => i.id !== id);
            saveItems(items);
            renderSavedItems();
            setStatus('🗑️ Удалено');
        }

        function loadSavedItem(item) {
            if (item.type === 'playlist') {
                loadPlaylistFromText(item.data, item.name);
                switchTab('playlist');
            } else if (item.type === 'stream') {
                playDirectUrl(item.url, item.name);
                switchTab('playlist');
            } else if (item.type === 'epg') {
                epgData = item.data || {};
                saveEpgToStorage(epgData);
                renderChannelList();
                updateEpgStatus();
                switchTab('epg');
            }
        }

        // ---------- EPG функции ----------
        function parseXmltv(xmlText) {
            const parser = new DOMParser();
            const xmlDoc = parser.parseFromString(xmlText, 'text/xml');
            const programmes = xmlDoc.getElementsByTagName('programme');
            const epg = {};

            for (let prog of programmes) {
                const channel = prog.getAttribute('channel') || '';
                const title = prog.getElementsByTagName('title')[0]?.textContent || 'Нет названия';
                const desc = prog.getElementsByTagName('desc')[0]?.textContent || '';
                const start = prog.getAttribute('start') || '';
                const stop = prog.getAttribute('stop') || '';

                const channelName = channel.replace(/[_-]/g, ' ').trim();
                if (!epg[channelName]) epg[channelName] = [];
                epg[channelName].push({
                    title,
                    desc,
                    start: formatXmltvDate(start),
                    stop: formatXmltvDate(stop)
                });
            }

            for (let ch in epg) {
                epg[ch].sort((a, b) => (a.start || '').localeCompare(b.start || ''));
            }

            return epg;
        }

        function formatXmltvDate(dateStr) {
            if (!dateStr || dateStr.length < 12) return '';
            const year = dateStr.substring(0, 4);
            const month = dateStr.substring(4, 6);
            const day = dateStr.substring(6, 8);
            const hour = dateStr.substring(8, 10);
            const min = dateStr.substring(10, 12);
            return `${day}.${month}.
